<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #1d1d1f; --muted: #5b6270; --line: #dcdfe5; --hover: #f1f5fd;
    --brand: #1e5ac8; --on-brand: #fff; --chip: #eef0f4; --ok: #17794a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1d22; --fg: #e9eaee; --muted: #a3a9b6; --line: #343842; --hover: #262a33;
            --brand: #3b74e0; --chip: #2b2f38; --ok: #5fd39a; }
  }
  body { font: 13px/1.4 system-ui, sans-serif; width: 440px; margin: 0; color: var(--fg); background: var(--bg); }
  header { padding: 10px 12px; background: var(--brand); color: var(--on-brand); }
  header h1 { font-size: 15px; margin: 0 0 6px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button, select, input { font: inherit; color: inherit; }
  button { border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; background: var(--chip); }
  button:hover { filter: brightness(.95); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  header :focus-visible { outline-color: #fff; }
  button.primary { background: var(--brand); color: var(--on-brand); font-weight: 600; width: 100%; padding: 10px; }
  button.primary:disabled { opacity: .5; cursor: default; }
  header button { background: #fff; color: #1e5ac8; font-weight: 600; }
  label.opt { font-size: 12px; cursor: pointer; }
  #toolbar { padding: 8px 12px 6px; }
  #filter { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  #types { padding: 0 12px 8px; border-bottom: 1px solid var(--line); }
  .chip { padding: 3px 9px; border-radius: 999px; font-size: 12px; border: 1px solid transparent; }
  .chip[aria-pressed=true] { background: var(--brand); color: var(--on-brand); }
  #list { max-height: 340px; overflow: auto; user-select: none; }
  .group, .file { display: flex; gap: 8px; padding: 5px 12px; align-items: center; cursor: pointer; }
  .group { position: sticky; top: 0; background: var(--bg); font-weight: 600; color: var(--muted);
           font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  .file { padding-left: 24px; }
  .group:hover, .file:hover { background: var(--hover); }
  .group span, .file span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 10px; background: var(--chip); border-radius: 4px; padding: 1px 5px; color: var(--muted); flex: none; }
  .tag.saved { color: var(--ok); }
  #status { padding: 10px 12px; color: var(--muted); }
  .hint { font-size: 11px; color: var(--muted); }
  footer { padding: 10px 12px; border-top: 1px solid var(--line); }
  #layout { flex: 1; padding: 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>Blackboard Bulk Downloader</h1>
    <div class="row">
      <button id="scan">Scan this page</button>
      <label class="opt"><input type="checkbox" id="deep" checked> include subfolders</label>
    </div>
  </header>
  <div id="toolbar" class="row hidden">
    <input id="filter" type="search" placeholder="Filter (e.g. lecture 3, week 2)" aria-label="Filter files by name or folder">
    <button id="all" title="Tick every file shown">All</button>
    <button id="none" title="Untick every file">None</button>
    <button id="invert" title="Flip the ticks on the files shown">Invert</button>
  </div>
  <div id="types" class="row hidden" aria-label="Filter by file type"></div>
  <div id="status" role="status">Open a Blackboard course page, then press <b>Scan this page</b>.</div>
  <div id="list"></div>
  <footer class="hidden" id="foot">
    <div class="row" style="margin-bottom:8px">
      <label for="layout">Save as:</label>
      <select id="layout">
        <option value="both">Both: folders + one "All Files" folder</option>
        <option value="folders">Separate folders only</option>
        <option value="flat">One "All Files" folder only</option>
      </select>
    </div>
    <button class="primary" id="go" disabled>Download</button>
    <div class="hint" style="margin-top:6px">Tip: tick a folder name to select the whole folder · Shift-click to select a range.</div>
  </footer>
  <script src="scanner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
